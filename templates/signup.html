<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - LearnHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .page {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .signup-container {
            max-width: 850px;
            margin: auto;
        }

        .signup-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .heading {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 18px;
            margin: 30px 0 18px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e5e7eb;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .signup-button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            min-height: 24px;
            color: #dc2626;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links p {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .hint {
            margin-top: 5px;
            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 700px) {

            .page {
                padding: 20px 12px;
            }

            .signup-card {
                padding: 28px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="signup-container">

            <div class="signup-card">

                <div class="logo">
                    LearnHub 🎓
                </div>

                <h1 class="heading">
                    Create Your Account
                </h1>

                <p class="subtitle">
                    Join LearnHub and start your learning journey.
                </p>


                <form id="signupForm">

                    <!-- Account Information -->

                    <h2 class="section-title">
                        Account Information
                    </h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="name">Name</label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your full name"
                                required>
                        </div>


                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required>
                        </div>


                        <div class="form-group full-width">
                            <label for="password">Password</label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required>

                            <div class="hint">
                                Use a password that you can remember.
                            </div>
                        </div>

                    </div>


                    <!-- Academic Information -->

                    <h2 class="section-title">
                        Academic Information
                    </h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="student_id">Student ID</label>

                            <input
                                type="text"
                                id="student_id"
                                placeholder="Enter student ID"
                                required>
                        </div>


                        <div class="form-group">
                            <label for="branch">Branch</label>

                            <input
                                type="text"
                                id="branch"
                                placeholder="e.g. IoT"
                                required>
                        </div>


                        <div class="form-group">
                            <label for="semester">Semester</label>

                            <input
                                type="text"
                                id="semester"
                                placeholder="e.g. 3-1"
                                required>
                        </div>


                        <div class="form-group">
                            <label for="cgpa">CGPA</label>

                            <input
                                type="number"
                                id="cgpa"
                                step="0.01"
                                min="0"
                                max="10"
                                placeholder="0 - 10"
                                required>
                        </div>


                        <div class="form-group">
                            <label for="previous_sgpa">
                                Previous Semester SGPA
                            </label>

                            <input
                                type="number"
                                id="previous_sgpa"
                                step="0.01"
                                min="0"
                                max="10"
                                placeholder="0 - 10"
                                required>
                        </div>


                        <div class="form-group">
                            <label for="backlogs">
                                Backlogs
                            </label>

                            <input
                                type="number"
                                id="backlogs"
                                min="0"
                                value="0"
                                required>
                        </div>

                    </div>


                    <button
                        type="submit"
                        class="signup-button">
                        Create Account 🚀
                    </button>

                </form>


                <p id="message"></p>


                <div class="links">

                    <p>
                        Already have an account?
                    </p>

                    <a href="/login">
                        Login to LearnHub
                    </a>

                    <br><br>

                    <a href="/">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script>

        document.getElementById("signupForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const student_id =
                    document.getElementById("student_id").value;

                const branch =
                    document.getElementById("branch").value;

                const semester =
                    document.getElementById("semester").value;

                const cgpa =
                    document.getElementById("cgpa").value;

                const previous_sgpa =
                    document.getElementById("previous_sgpa").value;

                const backlogs =
                    document.getElementById("backlogs").value;


                try {

                    const response = await fetch("/signup", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: name,
                            email: email,
                            password: password,
                            student_id: student_id,
                            branch: branch,
                            semester: semester,
                            cgpa: cgpa,
                            previous_sgpa: previous_sgpa,
                            backlogs: backlogs

                        })
                    });


                    const data = await response.json();


                    document.getElementById("message").textContent =
                        data.message;


                    if (response.ok) {

                        document.getElementById("signupForm").reset();

                    }

                } catch (error) {

                    console.error(error);

                    document.getElementById("message").textContent =
                        "Could not connect to the server.";

                }

            }
        );

    </script>

</body>

</html>
