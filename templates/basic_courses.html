<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Courses - LearnHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back-button {
            text-decoration: none;
            background: #374151;
            color: white;

            padding: 10px 18px;
            border-radius: 8px;

            font-size: 14px;
        }

        .back-button:hover {
            background: #4b5563;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
            margin: 0;
        }

        .plan-badge {
            display: inline-block;
            margin-top: 15px;

            padding: 7px 14px;
            border-radius: 20px;

            background: #dbeafe;
            color: #1d4ed8;

            font-size: 13px;
            font-weight: bold;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .course-card {
            background: white;
            border-radius: 16px;
            padding: 24px;

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .course-icon {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .course-card h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .course-card p {
            color: #6b7280;
            line-height: 1.6;
            font-size: 14px;
        }

        .course-button {
            display: inline-block;

            margin-top: 10px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            padding: 10px 18px;

            cursor: pointer;
            font-size: 14px;
        }

        .course-button:hover {
            background: #1d4ed8;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;

            padding: 25px;
            border-radius: 12px;

            text-align: center;
        }

        .error h3 {
            margin-top: 0;
        }

        .upgrade-button {
            display: inline-block;

            margin-top: 12px;

            background: #2563eb;
            color: white;

            text-decoration: none;

            padding: 10px 18px;
            border-radius: 8px;
        }

        .upgrade-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 800px) {
            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 94%;
            }

            .course-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">

        <h2>LearnHub 🎓</h2>

        <a href="/dashboard" class="back-button">
            ← Dashboard
        </a>

    </div>


    <div class="container">

        <div class="page-header">

            <h1>📘 Basic Courses</h1>

            <p>
                Build your technical skills with courses
                available under the Basic plan.
            </p>

            <span class="plan-badge">
                ⭐ Basic Plan Feature
            </span>

        </div>


        <div id="courseContainer">

            <div class="loading">
                Verifying your access...
            </div>

        </div>

    </div>


    <script>

        async function checkAccess() {

            const token =
                localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/login";
                return;
            }

            try {

                const response = await fetch(
                    "/api/check-feature/basic_courses",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    document.getElementById(
                        "courseContainer"
                    ).innerHTML = `

                        <div class="error">

                            <h3>
                                🔒 Basic Courses Unavailable
                            </h3>

                            <p>
                                Your current subscription
                                does not include Basic Courses.
                            </p>

                            <p>
                                Upgrade your plan to unlock
                                these courses and continue learning.
                            </p>

                            <a
                                href="/plans"
                                class="upgrade-button">

                                View Available Plans

                            </a>

                        </div>

                    `;

                    return;
                }


                loadCourses();

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "courseContainer"
                ).innerHTML = `

                    <div class="error">

                        <h3>
                            Unable to verify access
                        </h3>

                        <p>
                            Please refresh the page and try again.
                        </p>

                    </div>

                `;
            }
        }


        function loadCourses() {

            const courses = [

                {
                    icon: "🐍",
                    title: "Advanced Python",
                    description:
                        "Learn OOP, modules, exception handling, file handling and advanced Python concepts."
                },

                {
                    icon: "🗄️",
                    title: "SQL & Database Management",
                    description:
                        "Learn SQL queries, joins, relationships and database management fundamentals."
                },

                {
                    icon: "🧠",
                    title: "Data Structures",
                    description:
                        "Understand arrays, linked lists, stacks, queues and other essential data structures."
                },

                {
                    icon: "⚡",
                    title: "Algorithms",
                    description:
                        "Learn searching, sorting and algorithmic problem-solving techniques."
                },

                {
                    icon: "🌐",
                    title: "Web Development",
                    description:
                        "Build interactive websites using HTML, CSS and JavaScript fundamentals."
                },

                {
                    icon: "🔧",
                    title: "Software Engineering",
                    description:
                        "Understand software development processes, requirements and project practices."
                }

            ];


            let html = `
                <div class="course-grid">
            `;


            courses.forEach(course => {

                html += `

                    <div class="course-card">

                        <div class="course-icon">
                            ${course.icon}
                        </div>

                        <h2>
                            ${course.title}
                        </h2>

                        <p>
                            ${course.description}
                        </p>

                        <button
                            class="course-button"
                            onclick="startCourse(
                                '${course.title}'
                            )">

                            Start Learning

                        </button>

                    </div>

                `;

            });


            html += `
                </div>
            `;


            document.getElementById(
                "courseContainer"
            ).innerHTML = html;
        }


        function startCourse(courseName) {

            alert(
                "📘 " +
                courseName +
                " course content will be available here soon."
            );

        }


        checkAccess();

    </script>

</body>

</html>
