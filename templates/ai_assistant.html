<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Study Assistant - LearnHub</title>

    <style>
        html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: #1f2937;
            color: white;

            padding: 18px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back-button {
            text-decoration: none;

            background: #374151;
            color: white;

            padding: 9px 16px;
            border-radius: 8px;

            font-size: 14px;
        }

        .back-button:hover {
            background: #4b5563;
        }


        /* =========================
           MAIN LAYOUT
           ========================= */

        .container {
    width: 94%;
    max-width: 1200px;

    height: calc(100vh - 78px);

    margin: 0 auto;

    padding: 20px 0;

    overflow: hidden;
}

        .assistant-layout {
    display: grid;

    grid-template-columns: 270px minmax(0, 1fr);

    gap: 20px;

    height: 100%;

    min-height: 0;
}


        /* =========================
           CONVERSATION SIDEBAR
           ========================= */

        .conversation-sidebar {
    background: white;

    border-radius: 18px;

    box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.08);

    padding: 18px;

    display: flex;

    flex-direction: column;

    min-height: 0;

    overflow: hidden;
}

        .sidebar-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .sidebar-header h3 {
            margin: 0;

            font-size: 17px;
        }

        .new-chat-button {
            border: none;

            background: #2563eb;
            color: white;

            padding: 8px 12px;

            border-radius: 8px;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .new-chat-button:hover {
            background: #1d4ed8;
        }

        .conversation-list {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    overflow-x: hidden;

    display: flex;

    flex-direction: column;

    gap: 8px;
}

        .conversation-item {
            width: 100%;

            border: none;

            background: #f8fafc;

            text-align: left;

            padding: 11px 12px;

            border-radius: 9px;

            cursor: pointer;

            color: #334155;

            font-size: 13px;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .conversation-item:hover {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .conversation-item.active {
            background: #dbeafe;
            color: #1d4ed8;

            font-weight: 600;
        }

        .empty-conversations {
            color: #94a3b8;

            font-size: 13px;
            text-align: center;

            padding: 25px 10px;
        }


        /* =========================
           CHAT AREA
           ========================= */

        .chat-card {
            background: white;

            border-radius: 18px;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.08);

            overflow: hidden;

            display: flex;
            flex-direction: column;
        }
        .chat-card {
    background: white;

    border-radius: 18px;

    box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.08);

    overflow: hidden;

    display: flex;

    flex-direction: column;

    min-height: 0;
}

        .chat-header {
            padding: 18px 22px;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            gap: 12px;
        }

        .chat-avatar {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #eff6ff;

            font-size: 22px;
        }

        .chat-header h2 {
            margin: 0;

            font-size: 17px;
        }

        .chat-header span {
            display: block;

            margin-top: 3px;

            font-size: 12px;

            color: #16a34a;
        }


        /* =========================
           CHAT MESSAGES
           ========================= */

        .chat-messages {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding: 22px;

    background: #f8fafc;
}

        .message {
            display: flex;

            margin-bottom: 16px;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 78%;

            padding: 12px 15px;

            border-radius: 14px;

            line-height: 1.6;

            font-size: 14px;

            overflow-wrap: break-word;
        }

        .assistant .message-bubble {
            background: white;

            border: 1px solid #e5e7eb;

            color: #1f2937;
        }

        .user .message-bubble {
            background: #2563eb;

            color: white;
        }

        .typing {
            color: #64748b;

            font-size: 13px;

            font-style: italic;
        }


        /* =========================
           AI FORMATTING
           ========================= */

        .assistant .message-bubble h1,
        .assistant .message-bubble h2,
        .assistant .message-bubble h3 {
            margin: 16px 0 9px;

            color: #111827;

            line-height: 1.3;
        }

        .assistant .message-bubble h1 {
            font-size: 21px;
        }

        .assistant .message-bubble h2 {
            font-size: 18px;
        }

        .assistant .message-bubble h3 {
            font-size: 16px;
        }

        .assistant .message-bubble p {
            margin: 8px 0;
        }

        .assistant .message-bubble ul,
        .assistant .message-bubble ol {
            margin: 10px 0;

            padding-left: 24px;
        }

        .assistant .message-bubble li {
            margin: 6px 0;
        }

        .assistant .message-bubble strong {
            font-weight: 700;
        }

        .assistant .message-bubble code {
            background: #f1f5f9;

            padding: 2px 6px;

            border-radius: 5px;

            font-family: Consolas, monospace;

            font-size: 13px;
        }

        .assistant .message-bubble pre {
            background: #0f172a;

            color: #e2e8f0;

            padding: 14px;

            border-radius: 10px;

            overflow-x: auto;

            margin: 14px 0;
        }

        .assistant .message-bubble pre code {
            background: transparent;

            padding: 0;

            color: inherit;

            white-space: pre;
        }

        .assistant .message-bubble hr {
            border: 0;

            border-top: 1px solid #e5e7eb;

            margin: 16px 0;
        }


        /* =========================
           INPUT
           ========================= */

        .chat-input-area {
    flex-shrink: 0;

    padding: 16px;

    border-top: 1px solid #e5e7eb;

    display: flex;

    gap: 10px;

    background: white;
}

        .chat-input {
            flex: 1;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            padding: 12px 14px;

            font-size: 14px;

            outline: none;
        }

        .chat-input:focus {
            border-color: #2563eb;
        }

        .send-button {
            border: none;

            border-radius: 10px;

            padding: 12px 20px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .send-button:disabled {
            background: #94a3b8;

            cursor: not-allowed;
        }


        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 800px) {

            .assistant-layout {
                grid-template-columns: 1fr;
            }

            .conversation-sidebar {
                min-height: 180px;
            }

            .conversation-list {
                max-height: 150px;
            }

            .chat-messages {
                min-height: 400px;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 95%;
            }

            .message-bubble {
                max-width: 90%;
            }

            .chat-input-area {
                flex-direction: column;
            }

            .send-button {
                width: 100%;
            }
        }

    </style>

</head>

<body>


    <div class="navbar">

        <h2>LearnHub 🎓</h2>

        <a
            href="/dashboard"
            class="back-button">

            ← Dashboard

        </a>

    </div>


    <div class="container">

        <div class="assistant-layout">


            <!-- =========================
                 CONVERSATIONS
                 ========================= -->

            <aside class="conversation-sidebar">

                <div class="sidebar-header">

                    <h3>💬 Conversations</h3>

                    <button
                        class="new-chat-button"
                        onclick="createNewConversation()">

                        + New Chat

                    </button>

                </div>

                <div
                    id="conversationList"
                    class="conversation-list">

                    <div class="empty-conversations">
                        Loading conversations...
                    </div>

                </div>

            </aside>


            <!-- =========================
                 CHAT
                 ========================= -->

            <div class="chat-card">

                <div class="chat-header">

                    <div class="chat-avatar">
                        🤖
                    </div>

                    <div>

                        <h2 id="chatTitle">
                            LearnHub AI
                        </h2>

                        <span>
                            ● Premium AI Assistant
                        </span>

                    </div>

                </div>


                <div
                    id="chatMessages"
                    class="chat-messages">

                    <div class="message assistant">

                        <div class="message-bubble">

                            Hello! 👋 I'm your LearnHub AI
                            Study Assistant.

                            <br><br>

                            Start a new conversation and ask
                            me anything you'd like help understanding.

                        </div>

                    </div>

                </div>


                <div class="chat-input-area">

                    <input
                        id="chatInput"
                        class="chat-input"
                        type="text"
                        placeholder="Ask your study question..."
                        autocomplete="off">

                    <button
                        id="sendButton"
                        class="send-button"
                        onclick="sendMessage()">

                        Send

                    </button>

                </div>

            </div>

        </div>

    </div>


    <script>

        let currentConversationId = null;


        /* =====================================================
           Authentication
           ===================================================== */

        async function verifyPremiumAccess() {

            const token =
                localStorage.getItem("access_token");

            if (!token) {

                window.location.href = "/login";

                return false;
            }

            try {

                const response = await fetch(
                    "/api/check-feature/ai_assistant",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );

                if (!response.ok) {

                    window.location.href = "/dashboard";

                    return false;
                }

                return true;

            } catch (error) {

                console.error(error);

                window.location.href = "/dashboard";

                return false;
            }
        }


        /* =====================================================
           Create new conversation
           ===================================================== */

        async function createNewConversation() {

            const token =
                localStorage.getItem("access_token");

            if (!token) {

                window.location.href = "/login";

                return;
            }

            try {

                const response = await fetch(
                    "/api/ai/conversations",
                    {
                        method: "POST",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {

                    alert(
                        data.message ||
                        "Unable to create a new conversation."
                    );

                    return;
                }

                currentConversationId =
                    data.conversation_id;

                await loadConversations();

                clearChat();

            } catch (error) {

                console.error(error);

                alert(
                    "Unable to create a new conversation."
                );
            }
        }


        /* =====================================================
           Load conversation list
           ===================================================== */

        async function loadConversations() {

            const token =
                localStorage.getItem("access_token");

            try {

                const response = await fetch(
                    "/api/ai/conversations",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {

                    console.error(
                        data.message
                    );

                    return;
                }

                const list =
                    document.getElementById(
                        "conversationList"
                    );

                list.innerHTML = "";

                if (data.conversations.length === 0) {

                    list.innerHTML = `
                        <div class="empty-conversations">
                            No conversations yet.<br>
                            Click <b>+ New Chat</b> to begin.
                        </div>
                    `;

                    return;
                }

                data.conversations.forEach(
                    conversation => {

                        const button =
                            document.createElement("button");

                        button.className =
                            "conversation-item";

                        button.textContent =
                            "💬 " + conversation.title;

                        button.onclick = () => {

                            openConversation(
                                conversation.id
                            );

                        };

                        if (
                            conversation.id ===
                            currentConversationId
                        ) {

                            button.classList.add(
                                "active"
                            );
                        }

                        list.appendChild(button);

                    }
                );

            } catch (error) {

                console.error(
                    "Conversation loading error:",
                    error
                );
            }
        }


        /* =====================================================
           Open conversation
           ===================================================== */

        async function openConversation(
            conversationId
        ) {

            const token =
                localStorage.getItem("access_token");

            try {

                const response = await fetch(
                    "/api/ai/conversations/" +
                    conversationId,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );

                const data =
                    await response.json();

                if (!response.ok) {

                    console.error(
                        data.message
                    );

                    return;
                }

                currentConversationId =
                    conversationId;

                const messages =
                    document.getElementById(
                        "chatMessages"
                    );

                messages.innerHTML = "";

                document.getElementById(
                    "chatTitle"
                ).textContent =
                    data.conversation.title;


                data.messages.forEach(item => {

                    addMessage(
                        item.message,
                        item.role === "user"
                            ? "user"
                            : "assistant"
                    );

                });


                if (data.messages.length === 0) {

                    addMessage(
                        "This is a new conversation. 👋 Ask me anything about your studies.",
                        "assistant"
                    );
                }


                await loadConversations();

            } catch (error) {

                console.error(
                    "Open conversation error:",
                    error
                );
            }
        }


        /* =====================================================
           Clear current chat
           ===================================================== */

        function clearChat() {

            const messages =
                document.getElementById(
                    "chatMessages"
                );

            messages.innerHTML = "";

            document.getElementById(
                "chatTitle"
            ).textContent =
                "New Conversation";


            addMessage(
                "This is a new conversation. 👋 Ask me anything about your studies.",
                "assistant"
            );
        }


        /* =====================================================
           Escape HTML
           ===================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }


        /* =====================================================
           Format AI Markdown
           ===================================================== */

        function formatAssistantMessage(text) {

            let html =
                escapeHtml(text);


            html = html.replace(
                /```(?:python|javascript|js|html|css|sql|java|c|cpp)?\s*\n?([\s\S]*?)```/gi,
                function(match, code) {

                    return "<pre><code>" +
                        code.trim() +
                        "</code></pre>";

                }
            );


            html = html.replace(
                /^### (.*)$/gm,
                "<h3>$1</h3>"
            );

            html = html.replace(
                /^## (.*)$/gm,
                "<h2>$1</h2>"
            );

            html = html.replace(
                /^# (.*)$/gm,
                "<h1>$1</h1>"
            );


            html = html.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );


            html = html.replace(
                /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
                "<em>$1</em>"
            );


            html = html.replace(
                /`([^`\n]+)`/g,
                "<code>$1</code>"
            );


            html = html.replace(
                /^---$/gm,
                "<hr>"
            );


            html = html.replace(
                /(?:^|\n)((?:\s*[-*] .+(?:\n|$))+)/g,
                function(match, list) {

                    const items = list
                        .trim()
                        .split("\n")
                        .map(item =>
                            item.replace(
                                /^\s*[-*]\s+/,
                                ""
                            )
                        )
                        .map(item =>
                            "<li>" + item + "</li>"
                        )
                        .join("");

                    return "\n<ul>" +
                        items +
                        "</ul>\n";
                }
            );


            html = html.replace(
                /(?:^|\n)((?:\s*\d+\.\s+.+(?:\n|$))+)/g,
                function(match, list) {

                    const items = list
                        .trim()
                        .split("\n")
                        .map(item =>
                            item.replace(
                                /^\s*\d+\.\s+/,
                                ""
                            )
                        )
                        .map(item =>
                            "<li>" + item + "</li>"
                        )
                        .join("");

                    return "\n<ol>" +
                        items +
                        "</ol>\n";
                }
            );


            html = html
                .split(/\n{2,}/)
                .map(block => {

                    block = block.trim();

                    if (!block) {
                        return "";
                    }

                    if (
                        block.startsWith("<h1>") ||
                        block.startsWith("<h2>") ||
                        block.startsWith("<h3>") ||
                        block.startsWith("<ul>") ||
                        block.startsWith("<ol>") ||
                        block.startsWith("<pre>") ||
                        block.startsWith("<hr>")
                    ) {
                        return block;
                    }

                    return "<p>" +
                        block.replace(
                            /\n/g,
                            "<br>"
                        ) +
                        "</p>";
                })
                .join("");

            return html;
        }


        /* =====================================================
           Add message
           ===================================================== */

        function addMessage(text, sender) {

            const messages =
                document.getElementById(
                    "chatMessages"
                );

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "message " + sender;

            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";


            if (sender === "assistant") {

                bubble.innerHTML =
                    formatAssistantMessage(text);

            } else {

                bubble.textContent =
                    text;
            }


            wrapper.appendChild(bubble);

            messages.appendChild(wrapper);

            messages.scrollTop =
                messages.scrollHeight;
        }


        /* =====================================================
           Send message
           ===================================================== */

        async function sendMessage() {

    const input =
        document.getElementById("chatInput");

    const button =
        document.getElementById("sendButton");

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    if (!currentConversationId) {

        await createNewConversation();

        if (!currentConversationId) {
            return;
        }
    }


    const token =
        localStorage.getItem("access_token");


    addMessage(
        message,
        "user"
    );

    input.value = "";

    button.disabled = true;


    const messages =
        document.getElementById(
            "chatMessages"
        );


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message assistant";


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    bubble.textContent =
        "LearnHub AI is thinking...";


    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);


    messages.scrollTop =
        messages.scrollHeight;


    try {

        const response = await fetch(
            "/api/ai/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token
                },

                body: JSON.stringify({

                    message: message,

                    conversation_id:
                        currentConversationId

                })
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            bubble.textContent =
                errorText ||
                "Unable to process your question.";

            button.disabled = false;

            return;
        }


        // =====================================
        // Read streaming response
        // =====================================

        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();


        let fullResponse = "";

        let firstChunk = true;


        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {
                break;
            }


            const chunk =
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            if (firstChunk) {

                bubble.textContent = "";

                firstChunk = false;
            }


            fullResponse += chunk;


            // Show response as it arrives
            bubble.textContent =
                fullResponse;


            messages.scrollTop =
                messages.scrollHeight;
        }


        // =====================================
        // Apply Markdown formatting
        // =====================================

        bubble.innerHTML =
            formatAssistantMessage(
                fullResponse
            );


        // =====================================
        // Refresh conversation list
        // =====================================

        await loadConversations();


        // Update current title locally
        const conversationResponse =
            await fetch(
                "/api/ai/conversations/" +
                currentConversationId,
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const conversationData =
            await conversationResponse.json();


        if (conversationData.conversation) {

            document.getElementById(
                "chatTitle"
            ).textContent =
                conversationData.conversation.title;
        }


        messages.scrollTop =
            messages.scrollHeight;


    } catch (error) {

        console.error(
            "Streaming error:",
            error
        );


        bubble.textContent =
            "I'm having trouble connecting right now. Please try again.";
    }


    button.disabled = false;
}


        /* =====================================================
           Enter key
           ===================================================== */

        document
            .getElementById("chatInput")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        sendMessage();

                    }

                }
            );


        /* =====================================================
           Startup
           ===================================================== */

        async function initializeAssistant() {

            const allowed =
                await verifyPremiumAccess();


            if (!allowed) {
                return;
            }


            await loadConversations();


            /*
             * Automatically open the most
             * recently updated conversation.
             */

            try {

                const token =
                    localStorage.getItem(
                        "access_token"
                    );

                const response =
                    await fetch(
                        "/api/ai/conversations",
                        {
                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );

                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.conversations.length > 0
                ) {

                    await openConversation(
                        data.conversations[0].id
                    );

                }

            } catch (error) {

                console.error(error);

            }

        }


        initializeAssistant();

    </script>

</body>

</html>
