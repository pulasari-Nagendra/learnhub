<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LearnHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            min-height: 22px;
            color: #dc2626;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .signup-text {
            margin-bottom: 12px;
            color: #6b7280;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                LearnHub 🎓
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue your learning journey.
            </p>


            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>
                </div>


                <button
                    type="submit"
                    class="login-button">
                    Login
                </button>

            </form>


            <p id="message"></p>


            <div class="links">

                <p class="signup-text">
                    Don't have an account?
                </p>

                <a href="/signup">
                    Create an account
                </a>

                <br><br>

                <a href="/">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script>

        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                try {

                    const response = await fetch("/login", {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });

                    const data = await response.json();

                    document.getElementById("message").textContent =
                        data.message;

                    if (response.ok) {

                        localStorage.setItem(
                            "access_token",
                            data.access_token
                        );

                        window.location.href = "/dashboard";
                    }

                } catch (error) {

                    console.error(error);

                    document.getElementById("message").textContent =
                        "Could not connect to the server.";
                }

            }
        );

    </script>

</body>

</html>
