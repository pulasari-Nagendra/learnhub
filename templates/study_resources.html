<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Resources - LearnHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .back-button {
            text-decoration: none;
            background: #374151;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
        }

        .back-button:hover {
            background: #4b5563;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
            margin: 0;
        }

        .plan-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 7px 14px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: bold;
        }

        .resource-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .resource-card {
            background: white;
            border-radius: 16px;
            padding: 24px;

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .resource-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .resource-icon {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .resource-card h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .resource-card p {
            color: #6b7280;
            line-height: 1.6;
            font-size: 14px;
        }

        .resource-button {
            margin-top: 10px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 8px;

            padding: 10px 18px;

            cursor: pointer;
            font-size: 14px;
        }

        .resource-button:hover {
            background: #1d4ed8;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;

            padding: 25px;
            border-radius: 12px;

            text-align: center;
        }

        .error h3 {
            margin-top: 0;
        }

        .upgrade-button {
            display: inline-block;

            margin-top: 12px;

            background: #2563eb;
            color: white;

            text-decoration: none;

            padding: 10px 18px;
            border-radius: 8px;
        }

        .upgrade-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 800px) {
            .resource-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 94%;
            }

            .resource-grid {
                grid-template-columns: 1fr;
            }
        }
        .semester-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 18px;
}

.resource-button {
    width: 100%;
}

.resource-button:hover {
    background: #1d4ed8;
}
    </style>
</head>

<body>

    <div class="navbar">

        <h2>LearnHub 🎓</h2>

        <a href="/dashboard" class="back-button">
            ← Dashboard
        </a>

    </div>


    <div class="container">

        <div class="page-header">

            <h1>📖 Study Resources</h1>

            <p>
                Access additional materials designed to
                support your academic preparation.
            </p>

            <span class="plan-badge">
                ⭐ Basic & Premium Feature
            </span>

        </div>


        <div id="resourceContainer">

            <div class="loading">
                Verifying your access...
            </div>

        </div>

    </div>


    <script>

        async function checkAccess() {

            const token =
                localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/login";
                return;
            }

            try {

                const response = await fetch(
                    "/api/check-feature/study_resources",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );

                const data = await response.json();


                if (!response.ok) {

                    document.getElementById(
                        "resourceContainer"
                    ).innerHTML = `

                        <div class="error">

                            <h3>
                                🔒 Study Resources Unavailable
                            </h3>

                            <p>
                                Your current subscription
                                does not include Study Resources.
                            </p>

                            <p>
                                Upgrade your plan to unlock
                                additional learning materials.
                            </p>

                            <a
                                href="/plans"
                                class="upgrade-button">

                                View Available Plans

                            </a>

                        </div>

                    `;

                    return;
                }


                loadResources();

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "resourceContainer"
                ).innerHTML = `

                    <div class="error">

                        <h3>
                            Unable to verify access
                        </h3>

                        <p>
                            Please refresh the page and try again.
                        </p>

                    </div>

                `;
            }
        }


        function loadResources() {

            const years = [
                {
                    icon: "🎓",
                    title: "1st Year",
                    semesters: ["Semester 1", "Semester 2"]
                },
                {
                    icon: "🎓",
                    title: "2nd Year",
                    semesters: ["Semester 3", "Semester 4"]
                },
                {
                    icon: "🎓",
                    title: "3rd Year",
                    semesters: ["Semester 5", "Semester 6"]
                },
                {
                    icon: "🎓",
                    title: "4th Year",
                    semesters: ["Semester 7", "Semester 8"]
                }
            ];

            let html = `<div class="resource-grid">`;

            years.forEach(year => {

                html += `
                <div class="resource-card">

                    <div class="resource-icon">
                        ${year.icon}
                    </div>

                    <h2>
                        ${year.title}
                    </h2>

                    <p>
                        Access study resources organized by
                        semester for your IoT branch.
                    </p>

                    <div class="semester-buttons">
            `;

            year.semesters.forEach(semester => {

                html += `
                    <button
                        class="resource-button"
                        onclick="openSemester(
                            '${year.title}',
                            '${semester}'
                        )">

                        ${semester} →

                    </button>
                `;

            });

            html += `
                    </div>

                </div>
            `;

            });

            html += `</div>`;

            document.getElementById(
                "resourceContainer"
            ).innerHTML = html;
        }


        function openSemester(year, semester) {

            alert(
                "📖 " + year + " • " + semester +
                "\n\nSubjects and study resources will be added here soon."
            );

        }


        checkAccess();

    </script>

</body>

</html>
